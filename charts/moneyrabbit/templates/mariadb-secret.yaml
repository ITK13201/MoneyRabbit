{{- if not .Values.mariadb.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "moneyrabbit.mariadb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moneyrabbit.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mariadb.auth.rootPassword | quote }}
  MYSQL_USER: {{ .Values.mariadb.auth.username | quote }}
  MYSQL_PASSWORD: {{ .Values.mariadb.auth.password | quote }}
  MYSQL_DATABASE: {{ .Values.mariadb.auth.database | quote }}
{{- end }}
