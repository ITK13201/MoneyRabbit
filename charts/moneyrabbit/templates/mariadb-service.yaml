apiVersion: v1
kind: Service
metadata:
  name: {{ include "moneyrabbit.mariadb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moneyrabbit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    app.kubernetes.io/name: {{ include "moneyrabbit.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mariadb
