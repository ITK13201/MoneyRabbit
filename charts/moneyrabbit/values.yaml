frontend:
  image:
    repository: ghcr.io/itk13201/moneyrabbit-frontend
    tag: "1.0.4"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  resources: {}

backend:
  image:
    repository: ghcr.io/itk13201/moneyrabbit-backend
    tag: "1.0.4"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
  # Anthropic API key for AI transaction categorization.
  # Ignored when existingSecret is set.
  anthropicApiKey: ""
  # Name of an existing Secret containing DATABASE_URL and ANTHROPIC_API_KEY.
  # If set, no Secret is created by this chart.
  existingSecret: ""
  resources: {}

mariadb:
  image:
    repository: mariadb
    tag: "11.4"
    pullPolicy: IfNotPresent
  auth:
    database: moneyrabbit
    username: moneyrabbit
    # Passwords are ignored when existingSecret is set.
    password: ""
    rootPassword: ""
    # Name of an existing Secret containing MYSQL_ROOT_PASSWORD, MYSQL_USER,
    # MYSQL_PASSWORD, and MYSQL_DATABASE.
    # If set, no Secret is created by this chart.
    existingSecret: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources: {}
